<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<!-- 強制手機/iPad 全螢幕、不可縮放 -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>micro:bit 雙螺旋槳控制 (多點觸控版)</title>
<style>
  /* 鎖定整個畫面的捲動與縮放，專注於控制器體驗 */
  html, body {
    margin: 0;
    padding: 0;
    height: 100vh;
    width: 100vw;
    background-color: #f4f4f9;
    font-family: Arial, sans-serif;
    text-align: center;
    touch-action: none; /* 絕對禁止瀏覽器原生滾動和手勢 */
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-sizing: border-box;
  }

  /* 頂部控制區 */
  .header-zone {
    padding: 10px;
    flex-shrink: 0;
  }
  
  h1 { 
    font-size: 22px; 
    color: #333; 
    margin: 10px 0; 
  }
  
  /* 連線按鈕設定 */
  button {
    font-size: 20px;          
    padding: 20px 40px;       
    margin: 5px;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    background-color: #007BFF;
    color: white;
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    touch-action: manipulation;
  }
  button:active { background-color: #0056b3; }
  
  #status { 
    padding: 10px; 
    border-radius: 6px; 
    margin: 10px auto; 
    max-width: 400px;
    font-weight: bold;
    font-size: 16px;
  }
  .success { background: #e6ffed; color: #28A745; border: 1px solid #28A745;}
  .error   { background: #ffe6e6; color: #DC3545; border: 1px solid #DC3545;}

  /* 橫向/直向自動適應的滑動條區域 */
  .sliders-zone {
    flex: 1;
    display: flex;
    flex-direction: row;
    justify-content: space-around;
    align-items: stretch;
    padding: 10px 20px 30px 20px;
  }

  .slider-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    background: #fff;
    padding: 15px;
    border-radius: 15px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    flex: 1;
    max-width: 300px;
    margin: 0 10px;
  }
  
  .slider-wrapper h2 {
    margin: 0 0 10px 0;
    font-size: 20px;
  }

  /* 自訂多點觸控滑動條 */
  .custom-slider {
    position: relative;
    width: 80px;         
    flex: 1;             
    background: #e0e0e0;
    border-radius: 40px;
    margin: 10px 0;
    cursor: pointer;
    box-shadow: inset 0 2px 5px rgba(0,0,0,0.2);
  }

  /* 0的基準線 */
  .slider-zero-line {
    position: absolute;
    top: 50%;
    left: 10%;
    width: 80%;
    height: 4px;
    background: #fff;
    transform: translateY(-50%);
    pointer-events: none;
    z-index: 1;
  }

  /* 滑動圓球 */
  .slider-thumb {
    position: absolute;
    width: 80px;
    height: 80px;
    background: #007BFF;
    border-radius: 50%;
    left: 0;
    top: 50%; 
    transform: translateY(-50%);
    pointer-events: none; 
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    z-index: 2;
    transition: transform 0.1s;
  }

  /* 顯示數據區 */
  .data-labels {
    margin-top: 10px;
    margin-bottom: 10px;
  }
  .data-label { font-size: 16px; color: #666; }
  .current-val { font-size: 24px; font-weight: bold; color: #007BFF; margin-top: 5px; }

  /* 歸零按鈕獨立樣式 */
  .reset-btn {
    background-color: #DC3545; /* 紅色醒目 */
    padding: 15px 30px;
    font-size: 18px;
    border-radius: 10px;
    margin-top: auto; /* 讓按鈕靠底部對齊 */
  }
  .reset-btn:active { background-color: #c82333; }
</style>
</head>
<body>

<div class="header-zone">
  <h1>micro:bit 螺旋槳控制器</h1>
  <div class="controls">
    <button id="connectBluetooth">藍牙連線</button>
    <button id="connectUSB">USB連線</button>
  </div>
  <div id="status">尚未連線</div>
</div>

<div class="sliders-zone">
  <!-- 左螺旋槳 -->
  <div class="slider-wrapper">
    <h2>左側馬達</h2>
    <div class="custom-slider" id="sliderL">
      <div class="slider-zero-line"></div>
      <div class="slider-thumb" id="thumbL"></div>
    </div>
    <div class="data-labels">
      <div class="data-label" id="targetL_label">目標: 0</div>
      <div class="current-val" id="currentL_label">當前: 0</div>
    </div>
    <!-- 左側歸零按鈕 -->
    <button class="reset-btn" id="resetL">歸零</button>
  </div>

  <!-- 右螺旋槳 -->
  <div class="slider-wrapper">
    <h2>右側馬達</h2>
    <div class="custom-slider" id="sliderR">
      <div class="slider-zero-line"></div>
      <div class="slider-thumb" id="thumbR"></div>
    </div>
    <div class="data-labels">
      <div class="data-label" id="targetR_label">目標: 0</div>
      <div class="current-val" id="currentR_label">當前: 0</div>
    </div>
    <!-- 右側歸零按鈕 -->
    <button class="reset-btn" id="resetR">歸零</button>
  </div>
</div>

<script>
/* ==================== micro:bit 通訊 ==================== */
const UART_SERVICE_UUID         = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
const UART_TX_CHARACTERISTIC_UUID = "6e400002-b5a3-f393-e0a9-e50e24dcca9e"; 
const UART_RX_CHARACTERISTIC_UUID = "6e400003-b5a3-f393-e0a9-e50e24dcca9e"; 

let uBitDevice = null;         
let rxCharacteristic = null;   
let serialPort = null;         
const onMicrobitReceive = new EventTarget();

function setStatus(msg, isError = false) {
  const el = document.getElementById("status");
  el.textContent = msg;
  el.className = isError ? "error" : "success";
}

async function connectBluetooth() {
  try {
    setStatus("正在搜尋 micro:bit (藍牙)...");
    uBitDevice = await navigator.bluetooth.requestDevice({
      filters: [{ namePrefix: "BBC micro:bit" }],
      optionalServices: [UART_SERVICE_UUID]
    });
    uBitDevice.addEventListener("gattserverdisconnected", onBluetoothDisconnected);
    const server = await uBitDevice.gatt.connect();
    const service = await server.getPrimaryService(UART_SERVICE_UUID);
    const txChar = await service.getCharacteristic(UART_TX_CHARACTERISTIC_UUID);
    await txChar.startNotifications();
    txChar.addEventListener("characteristicvaluechanged", handleBluetoothData);
    rxCharacteristic = await service.getCharacteristic(UART_RX_CHARACTERISTIC_UUID);
    setStatus("✅ 藍牙已成功連接", false);
  } catch (err) {
    setStatus("❌ 藍牙連接失敗: " + err.message, true);
  }
}

function onBluetoothDisconnected() {
  setStatus("⚠️ micro:bit 藍牙已斷線", true);
  uBitDevice = null;
  rxCharacteristic = null;
}

function handleBluetoothData(event) {
  const value = event.target.value;
  const text = new TextDecoder().decode(value).trim();
  if (text) onMicrobitReceive.dispatchEvent(new CustomEvent("data", { detail: text }));
}

async function connectUSB() {
  try {
    setStatus("請選擇 micro:bit 的序列埠 (USB)...");
    serialPort = await navigator.serial.requestPort();
    await serialPort.open({ baudRate: 115200 });
    setStatus("✅ USB 已成功連接", false);
    
    const reader = serialPort.readable.getReader();
    const decoder = new TextDecoder();
    let buffer = ""; 
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      let lines = buffer.split("\n");
      buffer = lines.pop(); 
      for (let line of lines) {
        line = line.trim();
        if (line) onMicrobitReceive.dispatchEvent(new CustomEvent("data", { detail: line }));
      }
    }
  } catch (err) {
    setStatus("❌ USB 連接失敗: " + err.message, true);
  }
}

async function sendToMicrobit(message) {
  const data = message + "\n"; 
  const encoder = new TextEncoder();
  try {
    if (serialPort?.writable) {
      const writer = serialPort.writable.getWriter();
      await writer.write(encoder.encode(data));
      writer.releaseLock();
      return;
    }
    if (rxCharacteristic) {
      await rxCharacteristic.writeValue(encoder.encode(data));
      return;
    }
  } catch (err) {}
}

document.getElementById("connectBluetooth").addEventListener("click", connectBluetooth);
document.getElementById("connectUSB").addEventListener("click", connectUSB);


/* ==================== 自訂多點觸控滑動條邏輯 ==================== */

let targetL = 0, targetR = 0;       
let currentL = 0, currentR = 0;     
const accelStep = 2;                
const updateInterval = 50;          

function setupCustomSlider(sliderId, thumbId, updateCallback) {
  const slider = document.getElementById(sliderId);
  const thumb = document.getElementById(thumbId);
  let activePointerId = null;

  function updateValue(clientY) {
    const rect = slider.getBoundingClientRect();
    let percent = (clientY - rect.top) / rect.height;
    percent = Math.max(0, Math.min(1, percent));
    
    let val = Math.round((0.5 - percent) * 200);
    thumb.style.top = (percent * 100) + "%";
    
    updateCallback(val);
  }

  slider.addEventListener("pointerdown", (e) => {
    if (activePointerId !== null) return; 
    activePointerId = e.pointerId;
    slider.setPointerCapture(activePointerId); 
    thumb.style.transform = "translateY(-50%) scale(1.1)"; 
    updateValue(e.clientY);
  });

  slider.addEventListener("pointermove", (e) => {
    if (e.pointerId === activePointerId) {
      updateValue(e.clientY);
    }
  });

  function releasePointer(e) {
    if (e.pointerId === activePointerId) {
      activePointerId = null;
      thumb.style.transform = "translateY(-50%) scale(1)"; 
    }
  }
  slider.addEventListener("pointerup", releasePointer);
  slider.addEventListener("pointercancel", releasePointer);
}

// 註冊左邊滑動條
setupCustomSlider("sliderL", "thumbL", (val) => {
  targetL = val;
  document.getElementById("targetL_label").innerText = "目標: " + targetL;
});

// 註冊右邊滑動條
setupCustomSlider("sliderR", "thumbR", (val) => {
  targetR = val;
  document.getElementById("targetR_label").innerText = "目標: " + targetR;
});


/* ==================== 歸零按鈕邏輯 ==================== */

document.getElementById("resetL").addEventListener("click", () => {
  targetL = 0;
  document.getElementById("targetL_label").innerText = "目標: 0";
  document.getElementById("thumbL").style.top = "50%"; // 視覺上移回中間
});

document.getElementById("resetR").addEventListener("click", () => {
  targetR = 0;
  document.getElementById("targetR_label").innerText = "目標: 0";
  document.getElementById("thumbR").style.top = "50%"; // 視覺上移回中間
});


/* ==================== 螺旋槳漸進加速邏輯 ==================== */

setInterval(() => {
  let changed = false;
  
  if (currentL !== targetL) {
    if (Math.abs(targetL - currentL) <= accelStep) {
      currentL = targetL;
    } else {
      currentL += (targetL > currentL) ? accelStep : -accelStep;
    }
    changed = true;
  }
  
  if (currentR !== targetR) {
    if (Math.abs(targetR - currentR) <= accelStep) {
      currentR = targetR;
    } else {
      currentR += (targetR > currentR) ? accelStep : -accelStep;
    }
    changed = true;
  }
  
  if (changed) {
    document.getElementById("currentL_label").innerText = "當前: " + currentL;
    document.getElementById("currentR_label").innerText = "當前: " + currentR;
    
    // 發送格式： "左數值,右數值" (例如 "50,-20")
    sendToMicrobit(`${currentL},${currentR}`);
  }
}, updateInterval);

// 阻止 iOS/iPadOS 全域的雙指縮放與不必要的滾動
document.addEventListener('touchmove', function(event) {
  event.preventDefault();
}, { passive: false });

</script>
</body>
</html>
